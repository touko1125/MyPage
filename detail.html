<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DETAIL | TOHKO</title>
  <link rel="icon" href="./assets/image/favicon.png" type="image/png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
  :root {
    --c-primary: #FF5252;
    --c-secondary: #448AFF;
    --c-accent: #FFD740;
    --c-bg: #FFF8E1;
    --c-text: #263238;
    --c-white: #FFFFFF;
    
    --border: 3px solid var(--c-text);
    --shadow: 5px 5px 0px var(--c-text);
    
    --font-pixel: "DotGothic16", sans-serif;
    --font-round: "M PLUS Rounded 1c", sans-serif;
    --font-title: "Zen Maru Gothic", sans-serif;
  }

  body {
    background-color: var(--c-bg);
    color: var(--c-text);
    font-family: var(--font-round);
    margin: 0;
  }
  
  a { text-decoration: none; color: inherit; }

  /* Navigation */
  .nav-bar {
    position: fixed; top: 0; left: 0; width: 100%;
    padding: 1rem 2rem; pointer-events: none; z-index: 999;
  }
  .back-btn {
    pointer-events: auto; display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--c-white); border: var(--border); padding: 0.5rem 1.2rem;
    border-radius: 50px; font-weight: 800; font-family: var(--font-pixel);
    box-shadow: var(--shadow); transition: .2s;
  }
  .back-btn:hover { transform: translate(2px,2px); box-shadow:none; background: var(--c-accent); }

  /* Hero */
  .detail-hero {
    height: 50vh; min-height: 350px;
    background: #333; position: relative;
    border-bottom: var(--border);
    display: flex; align-items: flex-end;
  }
  .hero-overlay {
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    position: absolute; inset: 0; z-index: 1;
  }
  
  .hero-info {
    position: relative; z-index: 2; padding: 3rem 2rem;
    color: white; width: 100%; max-width: 1200px; margin: 0 auto;
  }
  .meta-tags { display: flex; gap: 0.8rem; margin-bottom: 1rem; }
  .meta-tag {
    background: var(--c-accent); color: var(--c-text);
    padding: 0.2rem 0.8rem; border-radius: 5px; font-weight: 800; font-family: var(--font-pixel);
    border: 2px solid var(--c-text); box-shadow: 3px 3px 0 rgba(0,0,0,0.5);
  }

  .project-title {
    font-family: var(--font-title); font-size: 3.5rem;
    text-shadow: 4px 4px 0 var(--c-text); line-height: 1.1; margin-bottom: 0.5rem;
  }
  
  /* Layout */
  .container {
    max-width: 1100px; margin: 0 auto; padding: 2rem;
    display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;
  }

  /* Cards */
  .card-box {
    background: var(--c-white); border: var(--border); border-radius: 20px;
    padding: 2rem; box-shadow: var(--shadow); margin-bottom: 2rem;
  }
  
  h2 {
    font-family: var(--font-pixel); font-size: 1.5rem;
    border-left: 5px solid var(--c-primary); padding-left: 1rem;
    margin-bottom: 1.5rem;
  }

  p { line-height: 1.8; margin-bottom: 1.5rem; }

  /* Side Info */
  .side-item {
    background: var(--c-white); border: var(--border); border-radius: 15px;
    padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: var(--shadow);
  }
  .side-title { font-family: var(--font-pixel); font-size: 1.2rem; border-bottom: 2px dashed #ccc; padding-bottom: 0.5rem; margin-bottom: 1rem; }

  /* Gallery */
  .gallery-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem;
  }
  .gallery-item {
    height: 120px; border: 2px solid var(--c-text); border-radius: 10px; overflow: hidden;
    position: relative; cursor: pointer; transition: .2s;
  }
  .gallery-item:hover { transform: scale(1.05); z-index: 10; border-color: var(--c-primary); }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
  
  .gallery-item.video::after {
    content: '\f04b'; font-family: "Font Awesome 6 Free"; font-weight: 900;
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: white; font-size: 1.5rem; text-shadow: 0 2px 0 black;
  }

  /* Link Button */
  .play-btn {
    display: block; text-align: center; background: var(--c-primary); color: white;
    padding: 1rem; border-radius: 50px; font-weight: 800; font-family: var(--font-title);
    border: var(--border); box-shadow: 4px 4px 0 var(--c-text); transition: .2s;
  }
  .play-btn:hover { transform: translate(2px, 2px); box-shadow: 0 0 0; background: #FF1744; }

  /* Tech List */
  .tech-list { list-style: none; padding: 0; }
  .tech-list li {
    background: #E3F2FD; border: 1px solid var(--c-secondary); border-radius: 5px;
    padding: 0.5rem; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 700;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .tech-list li::before { content: ''; width: 8px; height: 8px; background: var(--c-secondary); border-radius: 50%; }

  /* Modal */
  .image-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    z-index: 9999; display: none; justify-content: center; align-items: center;
    backdrop-filter: blur(5px);
  }
  .image-modal.active { display: flex; }
  .image-modal img, .image-modal iframe {
    max-width: 90%; max-height: 80vh; border: 5px solid white; border-radius: 10px;
  }
  .modal-close { position: absolute; top: 20px; right: 20px; font-size: 2rem; color: white; cursor: pointer; pointer-events: auto; }

  @media(max-width: 768px) {
    .container { grid-template-columns: 1fr; }
    .project-title { font-size: 2.5rem; }
  }
  </style>

  <script src="./assets/script/projectsData.js"></script>
  <script src="./assets/script/detail.js" defer></script>
</head>
<body>

  <!-- Modal -->
  <div id="imageModal" class="image-modal">
    <div class="modal-close"><i class="fas fa-times"></i></div>
    <i class="fas fa-chevron-left modal-nav modal-prev" style="position:absolute; left:20px; color:white; font-size:2rem; cursor:pointer;"></i>
    <img src="" alt="">
    <i class="fas fa-chevron-right modal-nav modal-next" style="position:absolute; right:20px; color:white; font-size:2rem; cursor:pointer;"></i>
  </div>

  <div class="nav-bar">
    <a href="works.html" class="back-btn"><i class="fas fa-undo"></i> BACK</a>
  </div>

  <div id="detailHeader" class="detail-hero">
    <div class="hero-overlay"></div>
    <div class="hero-info">
      <div id="detailTags" class="meta-tags"></div>
      <h1 id="detailTitle" class="project-title">Project Name</h1>
      <div style="font-weight:700;">
        <i class="far fa-clock"></i> <span id="detailDate">DATE</span> / 
        <i class="fas fa-tag"></i> <span id="detailCategory">GENRE</span>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="main-content">
      <div class="card-box">
        <h2>OVERVIEW</h2>
        <p id="detailOverview"></p>
      </div>

      <div class="card-box">
        <h2>FEATURES</h2>
        <p id="detailFeatures"></p>
      </div>

      <div class="card-box">
        <h2>GALLERY</h2>
        <div id="detailGallery" class="gallery-grid"></div>
      </div>
      
      <div class="card-box">
        <h2>TECHNICAL</h2>
        <p id="detailTechnology"></p>
      </div>

      <div class="card-box">
        <h2>CHALLENGES & LEARNING</h2>
        <p id="detailChallenges"></p>
        <p id="detailLearned"></p>
      </div>
    </div>

    <div class="side-content">
      <div class="side-item">
        <div class="side-title">LINKS</div>
        <div id="projectLinks"></div>
      </div>

      <div class="side-item">
        <div class="side-title">TECH STACK</div>
        <ul id="usageTechList" class="tech-list"></ul>
      </div>

      <div class="side-item">
        <div class="side-title">RELATED</div>
        <ul id="relatedWorks" style="padding:0; list-style:none;"></ul>
      </div>
    </div>
  </div>

  <footer style="text-align:center; padding:3rem; margin-top:2rem; font-family:'DotGothic16', sans-serif;">
    <p>&copy; 2025 TOHKO</p>
  </footer>

</body>
</html>
