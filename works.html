<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORKS | TOHKO</title>
  <link rel="icon" href="./assets/image/favicon.png" type="image/png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
  :root {
    --c-primary: #FF5252;
    --c-secondary: #448AFF;
    --c-accent: #FFD740;
    --c-bg: #E0E0E0;
    --c-text: #263238;
    --c-white: #FFFFFF;
    --c-gray: #B0BEC5;
    
    --border: 3px solid var(--c-text);
    --shadow: 4px 4px 0px rgba(0,0,0,0.2);
    --font-pixel: "DotGothic16", sans-serif;
    --font-round: "M PLUS Rounded 1c", sans-serif;
    --font-title: "Zen Maru Gothic", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background-color: var(--c-bg);
    color: var(--c-text);
    font-family: var(--font-round);
    /* グリッドパターン */
    background-image: 
      linear-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.3) 1px, transparent 1px);
    background-size: 20px 20px;
    padding-bottom: 5rem;
  }

  a { text-decoration: none; color: inherit; }

  /* Header */
  header {
    background: var(--c-text);
    color: white;
    padding: 1.5rem;
    position: sticky; top: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.3);
    border-bottom: 4px solid var(--c-accent);
  }
  .title { font-family: var(--font-pixel); font-size: 1.5rem; }
  .title i { color: var(--c-accent); }

  .back-btn {
    border: 2px solid white; padding: 0.5rem 1rem; border-radius: 10px;
    font-weight: 800; background: transparent; color: white;
    font-family: var(--font-pixel); transition: .2s;
  }
  .back-btn:hover { background: var(--c-accent); color: var(--c-text); border-color: var(--c-accent); }

  /* Main */
  main { max-width: 1200px; margin: 3rem auto; padding: 0 1rem; }

  h2 {
    text-align: center; font-family: var(--font-pixel); font-size: 2.5rem;
    margin-bottom: 2rem; color: var(--c-text);
    text-shadow: 2px 2px 0 var(--c-white);
  }

  /* Filters */
  .filter-section {
    display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 3rem;
  }
  .filter-btn {
    border: 3px solid var(--c-text);
    background: var(--c-white);
    padding: 0.6rem 1.5rem;
    border-radius: 5px;
    font-weight: 800;
    font-family: var(--font-pixel);
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--c-text);
    transition: .2s;
  }
  .filter-btn:hover, .filter-btn.active {
    transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--c-text);
    background: var(--c-secondary); color: white;
  }

  /* Works Grid */
  .works-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 3rem 2rem;
  }

  /* Cartridge Style Card */
  .cartridge {
    background: #F5F5F5; /* プラスチック筐体の色 */
    border: 3px solid #546E7A;
    border-radius: 10px 10px 40px 10px; /* カセットっぽい形状 */
    box-shadow: 
      inset 5px 5px 10px rgba(255,255,255,0.8),
      inset -5px -5px 10px rgba(0,0,0,0.1),
      8px 8px 0 rgba(0,0,0,0.2);
    display: flex; flex-direction: column;
    position: relative;
    transition: .3s;
    overflow: hidden;
  }
  .cartridge:hover {
    transform: translateY(-10px);
    box-shadow: 
      inset 5px 5px 10px rgba(255,255,255,0.8),
      inset -5px -5px 10px rgba(0,0,0,0.1),
      12px 12px 0 rgba(0,0,0,0.2);
  }

  /* 上部の窪みデザイン */
  .cartridge-header {
    height: 30px;
    background: #CFD8DC;
    border-bottom: 2px solid #90A4AE;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 10px;
  }
  .cartridge-lines {
    width: 60%; height: 60%;
    background: repeating-linear-gradient(90deg, #90A4AE, #90A4AE 2px, transparent 2px, transparent 6px);
  }
  
  /* ラベルエリア（サムネイル） */
  .card-thumb {
    height: 180px;
    margin: 10px 15px 0;
    border: 2px solid #333;
    border-radius: 5px;
    position: relative; overflow: hidden;
    background: #333;
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; transition: .5s; }
  .cartridge:hover .card-thumb img { transform: scale(1.1); filter: brightness(1.1); }

  /* 下部のグリップデザイン */
  .cartridge-footer {
    height: 20px;
    margin: 0 15px 10px;
    background: repeating-linear-gradient(180deg, #90A4AE, #90A4AE 2px, transparent 2px, transparent 5px);
    opacity: 0.3;
  }

  .card-body { padding: 1rem 1.5rem; flex: 1; display: flex; flex-direction: column; }
  
  .work-title {
    font-family: var(--font-pixel); font-size: 1.3rem; font-weight: 900;
    margin-bottom: 0.5rem; color: #37474F; line-height: 1.2;
    border-bottom: 2px solid #CFD8DC; padding-bottom: 0.5rem;
  }
  
  .work-tags { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .mini-tag {
    font-size: 0.7rem; background: #263238; color: #80CBC4;
    padding: 2px 6px; border-radius: 2px;
  }
  
  .work-desc { font-size: 0.85rem; color: #546E7A; margin-bottom: 1rem; flex-grow: 1; }

  .work-link {
    align-self: center; width: 100%; text-align: center;
    background: var(--c-primary); color: white;
    padding: 0.5rem; border-radius: 5px; font-weight: 800; font-family: var(--font-pixel);
    border: 2px solid #D32F2F; box-shadow: 0 4px 0 #D32F2F;
    transition: .1s;
  }
  .work-link:hover { transform: translateY(2px); box-shadow: 0 2px 0 #D32F2F; background: #FF5252; }

  /* Categories Badge */
  .cat-badges {
    position: absolute; top: 5px; right: 5px;
    display: flex; flex-direction: column; gap: 3px; align-items: flex-end;
  }
  .cat-badges span {
    background: rgba(0,0,0,0.8); color: #FFD740;
    border: 1px solid #FFD740;
    padding: 2px 6px; border-radius: 2px; font-size: 0.65rem; font-weight: 800; font-family: var(--font-pixel);
  }

  #loadingIndicator { text-align: center; font-size: 1.5rem; margin-top: 3rem; font-family: var(--font-pixel); }
  
  /* Animations */
  .animate-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; }
  @keyframes popIn {
      from { opacity: 0; transform: scale(0.8) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
  }

  footer { text-align: center; margin-top: 5rem; font-family: var(--font-pixel); color: #78909C; }

  @media(max-width: 600px) { .works-grid { grid-template-columns: 1fr; } }
  </style>

  <script src="./assets/script/projectsData.js"></script>
  <script src="./assets/script/works.js" defer></script>
</head>
<body>

<header>
  <div class="title"><i class="fas fa-gamepad"></i> WORKS LIBRARY</div>
  <a href="index.html" class="back-btn">EXIT</a>
</header>

<main>
  <h2>SELECT WORK</h2>
  
  <div class="filter-section" id="filterButtons">
    <!-- JSで生成されます -->
  </div>

  <div id="loadingIndicator"><i class="fas fa-spinner fa-spin"></i> LOADING...</div>
  
  <div class="works-grid" id="portfolioList" style="display:none;">
    <!-- JSで生成されます -->
  </div>
  
  <div id="noDataMessage" style="display:none; text-align:center; padding:3rem; font-family:'DotGothic16';">
    <p>NO CARTRIDGE FOUND...</p>
  </div>
</main>

<footer>
  <p>INSERT COIN TO CONTINUE...</p>
  <p style="margin-top:0.5rem; font-size:0.8rem;">&copy; 2025 SHIMADA TOHKO</p>
</footer>

</body>
</html>
